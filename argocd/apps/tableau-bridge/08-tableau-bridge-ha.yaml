# ==============================================================================
# Tableau Bridge High Availability (HA) Kubernetes Manifests
# 
# Catatan Arsitektur:
# Konfigurasi ('tableau-bridge-config') dan Secret ('tableau-bridge-secret')
# TIDAK di-hardcode di file YAML ini demi fleksibilitas & keamanan git.
# Keduanya dibuat dan disinkronisasi secara dinamis dari file '.env.tableau' via:
#   ./scripts/setup-tableau-bridge.sh
# ==============================================================================
---
# Service & Endpoints untuk menghubungkan Pod Tableau Bridge ke Host Podman MySQL 8
apiVersion: v1
kind: Service
metadata:
  name: mysql-podman-service
  labels:
    app: tableau-bridge
spec:
  ports:
  - name: mysql
    port: 3306
    targetPort: 3306
    protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: mysql-podman-service
  labels:
    app: tableau-bridge
subsets:
  - addresses:
      - ip: "10.89.1.2" # IP Container Podman MySQL 8
    ports:
      - name: mysql
        port: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tableau-bridge
  labels:
    app: tableau-bridge
    tier: analytics
spec:
  replicas: 2 # Konfigurasi High Availability (HA) via Tableau Bridge Pooling
  selector:
    matchLabels:
      app: tableau-bridge
  template:
    metadata:
      labels:
        app: tableau-bridge
    spec:
      # Pod Anti-Affinity memastikan Pod didistribusikan ke Node Kubernetes yang berbeda (HA Physical Isolation)
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - tableau-bridge
              topologyKey: "kubernetes.io/hostname"
      containers:
      - name: tableau-bridge
        image: localhost/tableau-bridge:latest # Menggunakan image lokal yang di-load ke Kind
        imagePullPolicy: Never
        env:
        - name: LANG
          value: "en_US.UTF-8"
        - name: LC_ALL
          value: "en_US.UTF-8"
        envFrom:
        - configMapRef:
            name: tableau-bridge-config
        - secretRef:
            name: tableau-bridge-secret
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        volumeMounts:
        - name: bridge-logs
          mountPath: /root/Documents/My_Tableau_Bridge_Repository/Logs
      volumes:
      - name: bridge-logs
        emptyDir: {}
