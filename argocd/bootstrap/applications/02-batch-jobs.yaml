apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: batch-jobs
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/dumalang/kube-labs.git
    targetRevision: poc/argo-cd
    path: argocd/apps/batch-jobs
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
