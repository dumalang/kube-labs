apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: microservices-ingress
  annotations:
    ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /api/v1/nodejs
        pathType: Prefix
        backend:
          service:
            name: service-a-nodejs
            port:
              number: 3000
      - path: /api/v1/golang
        pathType: Prefix
        backend:
          service:
            name: service-b-golang
            port:
              number: 8080
      - path: /api/v1/java
        pathType: Prefix
        backend:
          service:
            name: service-c-java
            port:
              number: 8080
