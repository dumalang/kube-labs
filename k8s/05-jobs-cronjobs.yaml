apiVersion: batch/v1
kind: Job
metadata:
  name: batch-worker-job
  labels:
    app: batch-worker
spec:
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: batch-worker
    spec:
      restartPolicy: Never
      containers:
      - name: worker
        image: alpine:3.19
        command: ["/bin/sh", "-c"]
        args:
        - |
          echo "=========================================="
          echo "🚀 [K8s Worker Job] Starting batch process..."
          echo "Simulating heavy computation / ETL pipeline..."
          for i in 1 2 3 4 5; do
            echo "Processing batch item $i/5..."
            sleep 1
          done
          echo "✅ [K8s Worker Job] Batch processing completed successfully!"
          echo "=========================================="
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: scheduled-cleanup-cronjob
  labels:
    app: scheduled-cleanup
spec:
  schedule: "*/2 * * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: cron-task
            image: alpine:3.19
            command: ["/bin/sh", "-c"]
            args:
            - |
              echo "------------------------------------------"
              echo "⏰ [K8s CronJob] Triggered at $(date)"
              echo "Running automated cache cleanup and metrics sync..."
              sleep 2
              echo "✨ [K8s CronJob] Cleanup task finished."
              echo "------------------------------------------"
