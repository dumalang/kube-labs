apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-a-nodejs
  labels:
    app: service-a-nodejs
spec:
  replicas: 2
  selector:
    matchLabels:
      app: service-a-nodejs
  template:
    metadata:
      labels:
        app: service-a-nodejs
    spec:
      containers:
      - name: nodejs-app
        image: localhost/service-a-nodejs:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
        env:
        - name: PORT
          value: "3000"
        - name: SERVICE_NAME
          value: "service-a-nodejs"
        - name: APP_ENV
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: APP_ENV
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: API_KEY
        - name: ELASTIC_APM_SERVICE_NAME
          value: "service-a-nodejs"
        - name: ELASTIC_APM_SERVER_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: ELASTIC_APM_SERVER_URL
        - name: ELASTIC_APM_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: ELASTIC_APM_ENVIRONMENT
        - name: ELASTIC_APM_ACTIVE
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: ELASTIC_APM_ACTIVE
        livenessProbe:
          httpGet:
            path: /api/v1/nodejs/healthz
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/v1/nodejs/readyz
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: service-a-nodejs
  labels:
    app: service-a-nodejs
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: service-a-nodejs
